# LuniMartian Atlas: one static page, and the page's two optional AI models.
# No cookies. nginx does not write the words of a visitor to a log: it logs the request line only.
limit_req_zone $binary_remote_addr zone=ai:10m rate=10r/s;

# The bare address on plain http. Links that people saved before the name existed keep working.
server {
    listen 80 default_server;
    server_name _;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    include /etc/nginx/conf.d/common.inc;
}

# The name on plain http goes to https.
server {
    listen 80;
    server_name spaceapps2026.researchedtechnologies.org;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

# The name on https.
server {
    listen 443 ssl;
    http2 on;
    server_name spaceapps2026.researchedtechnologies.org;
    ssl_certificate     /etc/letsencrypt/live/spaceapps2026.researchedtechnologies.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/spaceapps2026.researchedtechnologies.org/privkey.pem;
    include /etc/nginx/conf.d/common.inc;
}
